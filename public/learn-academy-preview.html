    <style>
      :root {
        --rail: #4c7a2c;
        --accent: #7fb13d;
        --accent-strong: #6ba02f;
        --text: #2f3431;
        --muted: #5f6661;
        --border: #e2e6e1;
        --bg: #f8f9f7;
        --sidebar-w: 300px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      /* Left icon rail */
      .rail {
        width: 64px;
        flex-shrink: 0;
        background: var(--rail);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 16px;
        gap: 20px;
      }
      .rail .logo {
        width: 40px; height: 40px;
        background: #fff;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; color: var(--accent-strong); font-size: 20px;
      }
      .rail .nav-icon {
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; opacity: .9; border-radius: 10px;
      }
      .rail .nav-icon.active { background: rgba(255,255,255,.18); }
      /* Lesson sidebar */
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-head {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-head h2 { font-size: 15px; font-weight: 700; }
      .sidebar-head p { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .lesson-list { flex: 1; overflow-y: auto; padding: 10px 10px 24px; }
      .module-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--accent-strong);
        padding: 16px 10px 6px;
      }
      .lesson-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        border-radius: 8px;
        padding: 9px 10px;
        cursor: pointer;
        font: inherit;
        color: var(--text);
        line-height: 1.35;
      }
      .lesson-item:hover { background: var(--bg); }
      .lesson-item.active { background: #eef6e2; color: var(--accent-strong); font-weight: 600; }
      .lesson-item .num {
        flex-shrink: 0;
        width: 20px; height: 20px;
        border-radius: 999px;
        background: var(--bg);
        border: 1px solid var(--border);

        color: var(--muted);
        margin-top: 1px;

      .lesson-item.active .num { background: var(--accent); color: #fff; border-color: var(--accent); }
      .lesson-item .txt { font-size: 13px; }
      /* Main content */

      .breadcrumb {
        display: flex; align-items: center; gap: 8px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        font-size: 13px; color: var(--muted);

      // Minimal CSV parser that respects quoted fields
      function parseCSV(text) {
        var rows = [];
        var row = [];
        var cur = "";
        var inQuotes = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (ch === '"') {
            if (inQuotes && text[i + 1] === '"') { cur += '"'; i++; }
            else inQuotes = !inQuotes;
          } else if (ch === "," && !inQuotes) {
            row.push(cur); cur = "";
          } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur); rows.push(row); row = []; cur = "";
          } else {
            cur += ch;
          }
        }
        if (cur.length || row.length) { row.push(cur); rows.push(row); }
        return rows;
      }

      var rows = parseCSV(CSV).slice(1).filter(function (r) { return r.length >= 4 && r[2] && r[3]; });
      var lastModule = "";
      var lessons = rows.map(function (r, idx) {
        var mod = (r[0] || "").trim();
        if (mod) lastModule = mod;
        return {
          id: idx,
          module: lastModule,
          order: (r[1] || "").trim(),
          title: (r[2] || "").trim(),
          videoUrl: (r[3] || "").trim(),
          description: (r[4] || "").trim(),
        };
      });

      // Build sidebar grouped by module
      var listEl = document.getElementById("lessonList");
      var currentModule = null;
      lessons.forEach(function (lesson) {
        if (lesson.module !== currentModule) {
          currentModule = lesson.module;
          var mt = document.createElement("div");
          mt.className = "module-title";
          mt.textContent = lesson.module;
          listEl.appendChild(mt);
        }
        var btn = document.createElement("button");
        btn.className = "lesson-item";
        btn.dataset.id = lesson.id;
        btn.innerHTML =
          '<span class="num">' + (lesson.order || "•") + "</span>" +
          '<span class="txt">' + lesson.title.replace(/</g, "&lt;") + "</span>";
        btn.addEventListener("click", function () { selectLesson(lesson.id); });
        listEl.appendChild(btn);
      });

      function selectLesson(id) {
        var lesson = lessons[id];
        if (!lesson) return;
        document.getElementById("videoFrame").src = lesson.videoUrl;
        document.getElementById("lessonTitle").textContent = lesson.title;
        document.getElementById("lessonModule").textContent = lesson.module.toUpperCase();
        document.getElementById("bcModule").textContent = lesson.module;
        document.getElementById("bcTitle").textContent = lesson.title;
        var desc = document.getElementById("lessonDesc");
        desc.textContent = lesson.description || "";
        desc.style.display = lesson.description ? "block" : "none";
        document.querySelectorAll(".lesson-item").forEach(function (el) {
          el.classList.toggle("active", el.dataset.id === String(id));
        });
      }

      if (lessons.length) selectLesson(0);
